# JVM options for the Gradle daemon. 2 GB is enough for this single-module app.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is required by every AndroidX dependency used here.
android.useAndroidX=true
# Each module's R class only carries its own resources; the app is a single module.
android.nonTransitiveRClass=true

kotlin.code.style=official
