name: Kotlin Android checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/test_contract.py && python3 tools/test_gateway.py && python3 tools/test_standalone.py
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu Android image already includes the SDK. Avoid re-downloading
      # command-line tools through the failing setup-android action.
      - name: Check preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
          fi
      - name: Assemble and lint
        shell: bash
        run: |
          set +e
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --console=plain --stacktrace 2>&1 | tee gradle-build.log
          result=${PIPESTATUS[0]}
          if [ "$result" -ne 0 ]; then
            python3 tools/annotate_build.py gradle-build.log
          fi
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-results
          path: |
            gradle-build.log
            app/build/outputs/apk/
            app/build/reports/
      - name: Export standalone project
        run: python3 tools/export_standalone.py
      - name: Verify independent Android build
        run: |
          unzip -q artifacts/offdic-standalone.zip -d "$RUNNER_TEMP/independent"
          cd "$RUNNER_TEMP/independent/offdic-standalone"
          ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: offdic-standalone
          path: artifacts/offdic-standalone.zip
  device-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain --stacktrace
      - name: Annotate device test failures
        if: always()
        run: python3 tools/annotate_device_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
